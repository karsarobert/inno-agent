<!doctype html>
<html lang="zh-CN" class="h-full">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Inno Agent</title>
		<script>
			// Apply persisted UI state before first paint to prevent a language/theme flash.
			(function () {
				try {
					var locale = localStorage.getItem("inno.locale");
					if (locale === "zh-CN" || locale === "en" || locale === "hu") {
						document.documentElement.lang = locale;
					}
					var t = localStorage.getItem("inno.theme") || "light";
					var valid = ["light", "warm", "ocean", "innospark"];
					if (valid.indexOf(t) === -1) t = "light";
					document.documentElement.setAttribute("data-theme", t);
				} catch (e) {}
			})();
		</script>
	</head>
	<body class="h-full m-0 bg-background text-foreground">
		<div id="root" class="h-full"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
